<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный слайдер изображений</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-card">
        <h2 class="slider-title">Галерея изображений</h2>
        
        <div class="slider-container">
            <img id="slider-image" src="" alt="Слайд">
            
            <button id="btn-prev" class="slider-btn btn-prev" aria-label="Предыдущее изображение">&#10094;</button>
            <button id="btn-next" class="slider-btn btn-next" aria-label="Следующее изображение">&#10095;</button>
        </div>

        <div class="slider-info">
            <span id="slide-counter">Изображение 1 из 5</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
